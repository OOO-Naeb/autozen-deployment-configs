services:
  rabbitmq:
    image: rabbitmq:management
    container_name: autozen-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - autozen_network

  autozen-api-gateway:
    image: autozen-api-gateway-service-image
    container_name: autozen-api-gateway-service
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_LOGIN: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8000:8000"
    networks:
      - autozen_network
    command: ["wait-for-it", "rabbitmq:5672", "--", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  autozen-auth-service:
    image: autozen-auth-service-image
    container_name: autozen-auth-service
    depends_on:
      - rabbitmq
      - autozen-api-gateway
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_LOGIN: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8001:8001"
    networks:
      - autozen_network
    command: ["wait-for-it", "rabbitmq:5672", "--", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001"]

networks:
  autozen_network:
    driver: bridge
